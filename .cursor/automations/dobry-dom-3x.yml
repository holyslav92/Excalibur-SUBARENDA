# Cursor Cloud Automation — Добрый дом (3 статьи / каждый день)
# Repository: holyslav92/Excalibur-SUBARENDA ONLY (never Excalibur-2-Cloud / tymenrieltor.ru)
# Import: Cursor → Automations → create from repo file or /automate skill
# Docs: https://cursor.com/docs/cloud-agent/automations

name: Добрый дом 3 статьи
enabled: true

repository:
  github: holyslav92/Excalibur-SUBARENDA
  branch: main

environment:
  timezone: Asia/Yekaterinburg
  # Link Cloud Environment «Excalibur-SUBARENDA» from dashboard (install from .cursor/environment.json)

trigger:
  - type: scheduled
    weekdays_only: false
    # Preferred (YEKT explicit):
    cron: "0 10,14,17 * * *"
    cron_tz: Asia/Yekaterinburg
    # Equivalent shell form:
    # CRON_TZ=Asia/Yekaterinburg 0 10,14,17 * * *
    # If Cursor UI stores cron in UTC only (YEKT = UTC+5):
    cron_utc_fallback: "0 5,9,12 * * *"

schedule_slots_yekt:
  - "10:00"
  - "14:00"
  - "17:00"

tools:
  memories: false
  open_pull_request: true
  computer_use: false
  mcp:
    enabled: true
    servers:
      - mcp-kv
    allow_tools:
      - wordstat_get_user_info
      - wordstat_get_top_requests
      - wordstat_get_dynamics
      - wordstat_get_regions
      - wordstat_get_regions_tree
    forbid_tools:
      - wordpress_*
    forbid_hosts:
      - tymenrieltor.ru

tenant:
  brand: Добрый дом
  site: добрыйдом-72.рф
  public_site_url: [REDACTED]
  publish_transport: ftp
  ftp_host: [REDACTED]
  ftp_port: 21
  ftp_user: ca21576_svyat
  ftp_root: [REDACTED]
  # FTP_PASS — ONLY Cloud Secrets (never commit)

cover:
  mode: brand_logo_paste
  logo: memory/cover/assets/brand/logo-dobry-dom.png
  images_per_article: 8
  max_attempts_per_canvas: 2
  paste_and_ship_on_exhaust: true
  rule: official logo on cover + 2-3 inline (default 1/3/7); NO host face / NO Shakin; beauty=agent judgment

brain_and_images:
  prose: scripts/excalibur_blog_derouter_opus_chat.py
  images: scripts/excalibur_blog_grsai_gpt_image2_api.py
  image_models: "Grsai PRIMARY_MODEL_ID only, vip disabled"
  forbid:
    - flux2-pro-*
    - seedream
    - nano_banana*
    - z-image
    - mcp-derouter/start-mcp.sh

publish_gate:
  allow_flag_env: EXCALIBUR_BLOG_ALLOW_PUBLISH
  allow_flag_git_default: "no"
  requires_cloud_secrets:
    - PUBLIC_SITE_URL
    - FTP_HOST
    - FTP_USER
    - FTP_PASS
    - FTP_PORT
    - FTP_TRANSPORT
    - FTP_ROOT

instructions: |
  Один слот = ОДНА статья-кейс «Добрый дом» на Дзен-клик (лайк, коммент, подписка), не гайд. Реп только holyslav92/Excalibur-SUBARENDA, ветка main. Никогда Excalibur-2-Cloud и tymenrieltor.ru. MCP-KV только wordstat_get_*. Проза — Derouter REST скриптом репа (не Composer, не mcp-derouter). Картинки — Grsai PRIMARY_MODEL_ID, VIP выключен, 2 холста × 4 = 8. Нет ключа Derouter или Grsai → BLOCKER, не писать и не рисовать самому.

  Канон ролей, без пропусков:
  Scout? → research_start → Research → Title → Writer → Sol → Description → Cover-text || Schema → Cover → Cover-QA → Indexer → Publish? → Fixer → merge → Content-learner

  Дирижёр Cursor не пишет абзацы и не рисует кадры. Writer = claude-opus-5 (полный CASE в drafts/writer.html, не тезисы). Scout / Research / Title / Sol / Description / Cover-text / Schema / Cover-scene = gpt-5.6-terra. Слог Sol — shared/SOUL.md + shared/soul-examples/. После Title и после Writer/Sol гонять scripts/excalibur_blog_case_delivery_gate.py. BLOCK → переписать роль, не публиковать.

  Дата: сегодня Asia/Yekaterinburg. Обложка = текущий сезон. Зима героем летом — запрет, пока Wordstat сам не орёт.

  Wordstat: вся Россия (регион 225). Боли БЕЗ города и те же С Тюменью. Заголовок может быть без слова «Тюмень». Пишем и сдаём только Тюмень. Гостевая боль: залог, код, ключница, заселение, предоплата, бойлер, собака, соседи, «рядом с вузом», скрытая доплата. Не юр-крючок Клышина (ЕГРН, суд, наследники, Москва). Не дублировать уже вышедшие (published-titles / коды-заселение, залог-скол на плите и любой близкий H1).

  ГОЛОС И ФОРМА (HARD, PR #52, слот не имеет права свернуть на гайд):
  H1 = двухтактный стоп-фактор уже случившейся гостевой ночи: [нормально]. А потом [ужас] / цитата / цифра. Не тема, не SEO, не «как снять», не «что проверить», не «N советов/шагов», не «разберём».
  §1 = 1–2 плотных абзаца holyslav: цитата → удар, ₽ или число ночей, что сломалось. **BAN duty-log** (день недели, календарная дата, часы HH:MM, «Тюмень, двор» в первом ударе). Бан рубленый TG-лид, TL;DR, «Разберём». H1 без часов HH:MM (слова «утром» OK). После лида: «Я хост посуточной в Тюмени. Это «Добрый дом».» Дальше удары Клышина: «Нет. Так не заселяем.» · «Не X. Не Y. А Z.» · вопрос-отмычка · «Сначала проверка. Потом перевод. Не наоборот.» 1100–1800 слов, один кейс, одна красная линия. Чеклист только после морали. Один вопрос в середине → ответ в t.me/Dobriy_dom_72 или MAX, никогда «напишите в комментариях». Конец: «Наш вывод простой.» + один блок воронки. Цель 9–10.

  Воронка ОДИН раз в конце: TG https://t.me/Dobriy_dom_72 · MAX https://max.ru/id660300569233_biz · бронь https://добрыйдом-72.рф/ и /booking/ · тел. +7 993 574-83-22 · менеджер https://t.me/Dobriy_dom_Tyumen. 3–4 живые /blog/ HTTP 200. Бан +7 922 001 65 05.

  Картинки: COVER = standalone type_meme_sticker_v3 poster (spectacular Cyrillic headline + exactly 1 catalog meme + LARGE phone die-cut sticker / info-board tablo). ZERO people on cover. INLINES = 2× quad designed grid unchanged. Grsai PRIMARY_MODEL_ID only, VIP off, standalone cover 2048×1152 + 2 inline quads, max 2 попытки/canvas, потом pad-clear (scene inpaint, NOT white fill) + factory alpha logo paste. Кот максимум 1/8. Логотип только memory/cover/assets/brand/logo-dobry-dom.png POST-gen top-right on scene texture — NO plate/card/box, never generation reference. Cover always + 2–3 inlines (1/3/7). Phone +7 (993) 574-83-22 as LARGE designed sticker — NOT tiny door magnet, NOT in-scene pill. build_standalone_cover_prompt() for cover; BAN people-photo scene cover. After upload: wp-content URLs + refresh *-1024x576 for /feed/zen/.

  Publish only добрыйдом-72.рф FTP ([REDACTED]:21 PASV root [REDACTED] user ca21576_svyat, password Cloud Secrets, EXCALIBUR_BLOG_ALLOW_PUBLISH=yes not in git. No flag → stop after Indexer. Never print secrets.

  Report: two-beat H1?, Wordstat angle, live URL or BLOCKER, word count, TG/MAX in body, 3–4 xlinks 200, which 2–3 frames have logo, 8 HTML images 200, case-delivery-gate PASS/BLOCK.
