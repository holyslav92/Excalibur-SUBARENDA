# Cursor Cloud Automation — Добрый дом (3 статьи / каждый день)
# Repository: holyslav92/Excalibur-SUBARENDA ONLY (never Excalibur-2-Cloud / tymenrieltor.ru)
# Import: Cursor → Automations → create from repo file or /automate skill
# Docs: https://cursor.com/docs/cloud-agent/automations

name: Добрый дом 3 статьи
enabled: true

repository:
  github: "[REDACTED]/Excalibur-SUBARENDA"
  branch: main

environment:
  timezone: Asia/Yekaterinburg
  # Link Cloud Environment «Excalibur-SUBARENDA» from dashboard (install from .cursor/environment.json)

trigger:
  - type: scheduled
    weekdays_only: false
    # Preferred (YEKT explicit):
    cron: "0 10,14,17 * * *"
    cron_tz: Asia/Yekaterinburg
    # Equivalent shell form:
    # CRON_TZ=Asia/Yekaterinburg 0 10,14,17 * * *
    # If Cursor UI stores cron in UTC only (YEKT = UTC+5):
    cron_utc_fallback: "0 5,9,12 * * *"

schedule_slots_yekt:
  - "10:00"
  - "14:00"
  - "17:00"

tools:
  memories: false
  open_pull_request: true
  computer_use: false
  mcp:
    enabled: true
    servers:
      - mcp-kv
    allow_tools:
      - wordstat_get_user_info
      - wordstat_get_top_requests
      - wordstat_get_dynamics
      - wordstat_get_regions
      - wordstat_get_regions_tree
    forbid_tools:
      - wordpress_*
    forbid_hosts:
      - tymenrieltor.ru

tenant:
  brand: Добрый дом
  site: добрыйдом-72.рф
  public_site_url: [REDACTED]
  publish_transport: ftp
  ftp_host: [REDACTED]
  ftp_port: 21
  ftp_user: ca21576_svyat
  ftp_root: [REDACTED]
  # FTP_PASS — ONLY Cloud Secrets (never commit)

cover:
  mode: one_2k_slice4
  canon_id: dobry_dom_gen_only_human_v1
  logo_mode: factory_paste_native_aspect
  logo: memory/cover/assets/brand/logo-dobry-dom.png
  images_per_article: 4
  grsai_draws_per_article: 1
  max_attempts_per_canvas: 2
  paste_and_ship_on_exhaust: true
  rule: >-
    ONE Grsai primary image model 2048×1152 as 2×2 grid → PIL slice 4 (cover+3 inline).
    Cover tile ONLY: paste official cropped-img_7143.png pixel-faithful (native aspect, NOT square).
    ZERO logo on inlines. NO 8-frame. NO poster_composite.

brain_and_images:
  prose: scripts/excalibur_blog_derouter_opus_chat.py
  images: scripts/excalibur_blog_grsai_gpt_image2_api.py
  image_models: "Grsai primary image model; VIP-on for 2K when primary fails"
  forbid:
    - flux2-pro-*
    - seedream
    - nano_banana*
    - z-image
    - mcp-derouter/start-mcp.sh

publish_gate:
  allow_flag_env: EXCALIBUR_BLOG_ALLOW_PUBLISH
  allow_flag_git_default: "no"
  requires_cloud_secrets:
    - PUBLIC_SITE_URL
    - FTP_HOST
    - FTP_USER
    - FTP_PASS
    - FTP_PORT
    - FTP_TRANSPORT
    - FTP_ROOT

instructions: |
  STEP 0 (HARD — до Scout): ViralDzen + gates. Не начинай Scout, пока не PASS:
    python3 scripts/excalibur_blog_viraldzen_slot.py
    python3 scripts/excalibur_blog_viral_handoff_gate.py
  Если VIRALDZEN BLOCKER или gate BLOCK — стоп слота, не выдумывай тему из Klyshin без Dzen. Не публикуй.

  Один слот = ОДНА статья-кейс «Добрый дом» (текст: dobry_dom_voice_reset_v1; картинки: dobry_dom_gen_only_human_v1). Реп только Excalibur-SUBARENDA, ветка main. Никогда Excalibur-2-Cloud и tymenrieltor.ru. MCP-KV только wordstat_get_*. Проза — Derouter REST скриптом репа (не Composer). Картинки — ONE Grsai 2048×1152, 1 draw → slice 4.

  Канон ролей:
  ViralDzen → viral_handoff_gate → viral_topic_repeat_gate → Scout? → research_start → Research → Title → Writer (claude-opus-5-5) → Sol → Description → Cover-text || Schema → Cover → Cover-QA → Indexer → Publish? → Fixer → merge → Content-learner

  Writer = claude-opus-5-5 only. Scout / viral-pick / Research / Title / Sol / Description / Cover-text / Schema / Cover-scene = gpt-6-luna (Derouter). Publish вызывает viral gates — без viral-dzen-handoff.json в article dir и без свежего PASS publish BLOCK.

  ГОЛОС (dobry_dom_voice_reset_v1): 650–1100 слов; anti-clone vs 12 live; BAN door-surcharge skeleton; scout-wound + case-delivery gates.

  Картинки (dobry_dom_gen_only_human_v1): без изменений — slice 4 + logo paste cover only.

  Report: viral gates PASS?, editorial PASS?, scout-wound + case-delivery PASS?, slice4 PASS?, word count 650–1100.
