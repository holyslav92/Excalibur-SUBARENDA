# Cursor Cloud Automation — Добрый дом (3 статьи / каждый день)
# Repository: holyslav92/Excalibur-SUBARENDA ONLY (never Excalibur-2-Cloud / tymenrieltor.ru)
# Import: Cursor → Automations → create from repo file or /automate skill
# Docs: https://cursor.com/docs/cloud-agent/automations

name: Добрый дом 3 статьи
enabled: true

repository:
  github: holyslav92/Excalibur-SUBARENDA
  branch: main

environment:
  timezone: Asia/Yekaterinburg
  # Link Cloud Environment «Excalibur-SUBARENDA» from dashboard (install from .cursor/environment.json)

trigger:
  - type: scheduled
    weekdays_only: false
    # Preferred (YEKT explicit):
    cron: "0 10,14,17 * * *"
    cron_tz: Asia/Yekaterinburg
    # Equivalent shell form:
    # CRON_TZ=Asia/Yekaterinburg 0 10,14,17 * * *
    # If Cursor UI stores cron in UTC only (YEKT = UTC+5):
    cron_utc_fallback: "0 5,9,12 * * *"

schedule_slots_yekt:
  - "10:00"
  - "14:00"
  - "17:00"

tools:
  memories: false
  open_pull_request: true
  computer_use: false
  mcp:
    enabled: true
    servers:
      - mcp-kv
    allow_tools:
      - wordstat_get_user_info
      - wordstat_get_top_requests
      - wordstat_get_dynamics
      - wordstat_get_regions
      - wordstat_get_regions_tree
    forbid_tools:
      - wordpress_*
    forbid_hosts:
      - tymenrieltor.ru

tenant:
  brand: Добрый дом
  site: добрыйдом-72.рф
  public_site_url: [REDACTED]
  publish_transport: ftp
  ftp_host: [REDACTED]
  ftp_port: 21
  ftp_user: ca21576_svyat
  ftp_root: [REDACTED]
  # FTP_PASS — ONLY Cloud Secrets (never commit)

cover:
  mode: one_2k_slice4
  canon_id: dobry_dom_one_2k_slice4_v1
  logo_mode: factory_paste_native_aspect
  logo: memory/cover/assets/brand/logo-dobry-dom.png
  images_per_article: 4
  grsai_draws_per_article: 1
  max_attempts_per_canvas: 2
  paste_and_ship_on_exhaust: true
  rule: >-
    ONE Grsai primary image model 2048×1152 as 2×2 grid → PIL slice 4 (cover+3 inline).
    Cover tile ONLY: paste official cropped-img_7143.png pixel-faithful (native aspect, NOT square).
    ZERO logo on inlines. NO 8-frame. NO poster_composite.

brain_and_images:
  prose: scripts/excalibur_blog_derouter_opus_chat.py
  images: scripts/excalibur_blog_grsai_gpt_image2_api.py
  image_models: "Grsai PRIMARY_MODEL_ID only, vip disabled"
  forbid:
    - flux2-pro-*
    - seedream
    - nano_banana*
    - z-image
    - mcp-derouter/start-mcp.sh

publish_gate:
  allow_flag_env: EXCALIBUR_BLOG_ALLOW_PUBLISH
  allow_flag_git_default: "no"
  requires_cloud_secrets:
    - PUBLIC_SITE_URL
    - FTP_HOST
    - FTP_USER
    - FTP_PASS
    - FTP_PORT
    - FTP_TRANSPORT
    - FTP_ROOT

instructions: |
  Один слот = ОДНА статья-кейс «Добрый дом» на Дзен-клик (лайк, коммент, подписка), не гайд. Реп только holyslav92/Excalibur-SUBARENDA, ветка main. Никогда Excalibur-2-Cloud и tymenrieltor.ru. MCP-KV только wordstat_get_*. Проза — Derouter REST скриптом репа (не Composer, не mcp-derouter). Картинки — Grsai PRIMARY_MODEL_ID, VIP выключен, 2 холста × 4 = 8. Нет ключа Derouter или Grsai → BLOCKER, не писать и не рисовать самому.

  Канон ролей, без пропусков:
  Scout? → research_start → Research → Title → Writer → Sol → Description → Cover-text || Schema → Cover → Cover-QA → Indexer → Publish? → Fixer → merge → Content-learner

  Дирижёр Cursor не пишет абзацы и не рисует кадры. Writer = claude-opus-5 (полный CASE в drafts/writer.html, не тезисы). Scout / Research / Title / Sol / Description / Cover-text / Schema / Cover-scene = gpt-5.6-terra. Слог Sol — shared/SOUL.md + shared/soul-examples/. После Title и после Writer/Sol гонять scripts/excalibur_blog_case_delivery_gate.py. BLOCK → переписать роль, не публиковать.

  Дата: сегодня Asia/Yekaterinburg. Обложка = текущий сезон. Зима героем летом — запрет, пока Wordstat сам не орёт.

  Wordstat: вся Россия (регион 225). Боли БЕЗ города и те же С Тюменью. Заголовок может быть без слова «Тюмень». Пишем и сдаём только Тюмень. Гостевая боль: залог, код, ключница, заселение, предоплата, бойлер, собака, соседи, «рядом с вузом», скрытая доплата. Не юр-крючок Клышина (ЕГРН, суд, наследники, Москва). Не дублировать уже вышедшие (published-titles / коды-заселение, залог-скол на плите и любой близкий H1).

  ГОЛОС И ФОРМА (HARD — klyshin_manner_dobry_dom_v1): 700–1100 слов, hard fail >1300. §1 = 2–4 предложения раны + цитата/₽. 2–4 коротких H2. ONE «Мой вывод как практика». BAN «Наш вывод простой.» и повтор штампов. Чеклист только NEW checks. Один вопрос в середине → TG/MAX. Финал: вопрос двух лагерей + один CTA. Gate: excalibur_blog_case_delivery_gate.py.

  Картинки (HARD — dobry_dom_one_2k_slice4_v1): ONE Grsai primary image model 2048×1152 как 2×2 grid → slice 4 (cover+3 inline). ZERO второго draw. Cover tile: paste official cropped-img_7143.png pixel-faithful (native aspect, NOT square), top-right ~8–12%, no plaque. Inlines ZERO logo. Gate: excalibur_blog_slice4_gate.py. RSS: 1 featured + 3 in-body.

  Report: manner_canon PASS?, slice4 gate PASS?, word count 700–1100, 4 images, case-delivery-gate PASS/BLOCK.
