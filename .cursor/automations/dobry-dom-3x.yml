# Cursor Cloud Automation — Добрый дом (3 статьи / каждый день)
# Repository: holyslav92/Excalibur-SUBARENDA ONLY (never Excalibur-2-Cloud / tymenrieltor.ru)
# Import: Cursor → Automations → create from repo file or /automate skill
# Docs: https://cursor.com/docs/cloud-agent/automations

name: Добрый дом 3 статьи
enabled: true

repository:
  github: holyslav92/Excalibur-SUBARENDA
  branch: main

environment:
  timezone: Asia/Yekaterinburg
  # Link Cloud Environment «Excalibur-SUBARENDA» from dashboard (install from .cursor/environment.json)

trigger:
  - type: scheduled
    weekdays_only: false
    # Preferred (YEKT explicit):
    cron: "0 10,14,17 * * *"
    cron_tz: Asia/Yekaterinburg
    # Equivalent shell form:
    # CRON_TZ=Asia/Yekaterinburg 0 10,14,17 * * *
    # If Cursor UI stores cron in UTC only (YEKT = UTC+5):
    cron_utc_fallback: "0 5,9,12 * * *"

schedule_slots_yekt:
  - "10:00"
  - "14:00"
  - "17:00"

tools:
  memories: false
  open_pull_request: true
  computer_use: false
  mcp:
    enabled: true
    servers:
      - mcp-kv
    allow_tools:
      - wordstat_get_user_info
      - wordstat_get_top_requests
      - wordstat_get_dynamics
      - wordstat_get_regions
      - wordstat_get_regions_tree
    forbid_tools:
      - wordpress_*
    forbid_hosts:
      - tymenrieltor.ru

tenant:
  brand: Добрый дом
  site: добрыйдом-72.рф
  public_site_url: [REDACTED]
  publish_transport: ftp
  ftp_host: [REDACTED]
  ftp_port: 21
  ftp_user: ca21576_svyat
  ftp_root: [REDACTED]
  # FTP_PASS — ONLY Cloud Secrets (never commit)

cover:
  mode: one_2k_slice4
  canon_id: dobry_dom_gen_only_human_v1
  logo_mode: factory_paste_native_aspect
  logo: memory/cover/assets/brand/logo-dobry-dom.png
  images_per_article: 4
  grsai_draws_per_article: 1
  max_attempts_per_canvas: 2
  paste_and_ship_on_exhaust: true
  rule: >-
    ONE Grsai primary image model 2048×1152 as 2×2 grid → PIL slice 4 (cover+3 inline).
    Cover tile ONLY: paste official cropped-img_7143.png pixel-faithful (native aspect, NOT square).
    ZERO logo on inlines. NO 8-frame. NO poster_composite.

brain_and_images:
  prose: scripts/excalibur_blog_derouter_opus_chat.py
  images: scripts/excalibur_blog_grsai_gpt_image2_api.py
  image_models: "Grsai primary image model; VIP-on for 2K when primary fails"
  forbid:
    - flux2-pro-*
    - seedream
    - nano_banana*
    - z-image
    - mcp-derouter/start-mcp.sh

publish_gate:
  allow_flag_env: EXCALIBUR_BLOG_ALLOW_PUBLISH
  allow_flag_git_default: "no"
  requires_cloud_secrets:
    - PUBLIC_SITE_URL
    - FTP_HOST
    - FTP_USER
    - FTP_PASS
    - FTP_PORT
    - FTP_TRANSPORT
    - FTP_ROOT

  instructions: |
  Один слот = ОДНА статья-кейс «Добрый дом», разговор у двери (dobry_dom_gen_only_human_v1). Реп только holyslav92/Excalibur-SUBARENDA, ветка main. Никогда Excalibur-2-Cloud и tymenrieltor.ru. MCP-KV только wordstat_get_*. Проза — Derouter REST скриптом репа (не Composer, не mcp-derouter). Картинки — ONE Grsai primary image 2048×1152 (VIP-on для 2K если primary не тянет), 1 draw → slice 4. ЗАПРЕЩЕНО: 2 холста × 4 = 8, poster_composite, phone overlay, logo в images[]. Нет ключа Derouter или Grsai → BLOCKER.

  Канон ролей, без пропусков:
  Scout? → research_start → Research → Title → Writer → Sol → Description → Cover-text || Schema → Cover → Cover-QA → Indexer → Publish? → Fixer → merge → Content-learner

  Дирижёр Cursor не пишет абзацы и не рисует кадры. Writer = claude-opus-5. Scout / Research / Title / Sol / Description / Cover-text / Schema / Cover-scene = gpt-5.6-terra. Слог Sol — shared/SOUL.md + shared/soul-examples/. После Title и после Writer/Sol гонять scripts/excalibur_blog_case_delivery_gate.py. BLOCK → переписать роль, не публиковать.

  ГОЛОС (HARD — dobry_dom_gen_only_human_v1): 700–1100 слов. §1 = что случилось + цитата или ₽ — гость понимает без второго чтения. Короткие предложения, как у двери. BAN загадочный H1, «под вопросом», clever structure. Телефон +7 (993) 574-83-22 только в ТЕКСТЕ, не на картинке.

  Картинки (HARD — dobry_dom_gen_only_human_v1): ONE Grsai primary image 2048×1152 как 2×2 photoreal grid → slice 4 (cover+3 inline). Headline кириллицей НА предмете в кадре (бумага, табличка, ТВ) — НЕ Canva overlay, НЕ жёлтый маркер, НЕ стикер, НЕ phone pill. После slice: paste cropped-img_7143.png ТОЛЬКО на cover tile. Единственные скрипты: quad_split + brand_logo_composite. Gate: excalibur_blog_slice4_gate.py + case_delivery_gate.py.

  Report: manner_canon PASS?, slice4 gate PASS?, word count 700–1100, 4 images, 1 grsai draw, case-delivery-gate PASS/BLOCK.
